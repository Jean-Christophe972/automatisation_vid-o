name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dépendances
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L'image Railway se construit
        run: docker build -t contentmachine .
      - name: L'image contient tout ce qu'il faut pour rendre une histoire
        run: |
          docker run --rm contentmachine python -c "
          import shutil; from pathlib import Path
          from contentmachine import storyboard, render, whitelist
          storyboard._validator(); whitelist.load()
          assert shutil.which('ffmpeg'), 'ffmpeg absent'
          assert any(p and Path(p).is_file() for p in render.FONT_PATHS), 'police absente'
          print('image OK')"
