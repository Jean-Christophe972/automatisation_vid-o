[project]
name = "contentmachine"
version = "0.5.0"
description = "Orchestrateur de la machine à contenu (clips gaming + histoires stickman)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
    "pillow==11.0.0",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contentmachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
